name: Static checks
on:
  push:
  pull_request:
jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax + unit tests
        run: |
          python3 -m compileall -q controller lambda tools
          python3 -m unittest discover -s tests -v
      - name: Bash syntax
        run: bash -n ffmpeg/start-camera.sh
