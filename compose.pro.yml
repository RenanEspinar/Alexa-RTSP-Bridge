services:
  bridge:
    build:
      context: ./alexa_bridge
    container_name: alexa_rtsp_bridge_pro_beta
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-30}
      SNAPSHOT_TTL: ${SNAPSHOT_TTL:-120}
    ports:
      # Control panel only via localhost / SSH tunnel.
      - "127.0.0.1:${UI_PORT:-8099}:8099"
      # Public stream must use HTTPS ingress (Cloudflare Tunnel or reverse proxy).
      - "127.0.0.1:${HLS_PORT:-8090}:8090"
    volumes:
      - bridge_pro_data:/data
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/state', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
  ai:
    profiles: ["ai"]
    build:
      context: ./alexa_bridge
      dockerfile: Dockerfile.ai
    container_name: alexa_rtsp_bridge_pro_ai
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      AI_HA_URL: ${AI_HA_URL:-}
      AI_HA_TOKEN: ${AI_HA_TOKEN:-}
      AI_HA_NOTIFY_SERVICE: ${AI_HA_NOTIFY_SERVICE:-}
    volumes:
      - bridge_pro_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; p=json.load(open('/data/ai/status.json')); assert time.time()-p['epoch']<45"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
volumes:
  bridge_pro_data:
