server {
    listen 80;
    server_name _;
    access_log off;  # signed links are credentials; do not log them
    server_tokens off;

    location /s/ {
        proxy_pass http://controller:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }
    location / {
        return 404;
    }
}
